version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: resumeai:local
    container_name: resumeai-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=docker-secret-key-replace-in-production-vault
    volumes:
      - resumeai_data:/app/instance

volumes:
  resumeai_data:
    name: resumeai_data
