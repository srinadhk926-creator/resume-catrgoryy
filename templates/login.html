{% extends "base.html" %}

{% block title %}Sign In — ResumeAI{% endblock %}

{% block content %}
<div class="container auth-container">
  <div class="card auth-card">
    <div class="auth-header">
      <span class="auth-icon">🔐</span>
      <h2 class="card-title">Welcome Back</h2>
      <p class="card-text">Sign in to your ResumeAI account to view your dashboard and history.</p>
    </div>

    <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ email or '' }}" placeholder="engineer@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
