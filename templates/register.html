{% extends "base.html" %}

{% block title %}Create Account — ResumeAI{% endblock %}

{% block content %}
<div class="container auth-container">
  <div class="card auth-card">
    <div class="auth-header">
      <span class="auth-icon">📝</span>
      <h2 class="card-title">Create an Account</h2>
      <p class="card-text">Join ResumeAI to track your candidate classifications and access history.</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" name="name" id="name" class="form-control" value="{{ name or '' }}" placeholder="Sarah Connor" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ email or '' }}" placeholder="sarah@example.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
    </div>
  </div>
</div>
{% endblock %}
